[project]
name = "pdf-inventory-project"
version = "0.2.0"
description = "Pipeline enterprise estruturado para inventário e curadoria inteligente de PDFs técnicos prontos para BI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "google-genai>=0.1.0",
    "pymupdf>=1.23.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "streamlit>=1.30.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

